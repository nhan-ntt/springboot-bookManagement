spring.application.name=nhonApp

## H2 Database configuration
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=password

# Database configuration
spring.datasource.url=jdbc:mariadb://localhost:3306/nhon
spring.datasource.username=user
spring.datasource.password=thanhnhan
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
#spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.cloud.compatibility-verifier.enabled=false


# JPA/Hibernate properties
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Settings
jwt.secret=your-super-secret-key-that-is-long-and-secure
jwt.expiration=86400000


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.packages-to-scan=com.example.nhonApp.controller


spring.redis.host=localhost
spring.redis.port=6379